# Overlay for the existing isolated project; does not alter its three services.
services:
  mock-upstream:
    image: python:3.12-slim
    command: [python, /mock.py]
    environment:
      MOCK_KEY: ${SUB2_ACCEPTANCE_MOCK_KEY:?required}
    volumes:
      - ./scripts/sub2api-acceptance-mock.py:/mock.py:ro
      - ${SUB2_ACCEPTANCE_RUNTIME:?required}:/runtime
    ports:
      - '127.0.0.1:18884:8090'
    networks: [pool]
  acceptance-gateway:
    image: node:24-bookworm-slim
    working_dir: /runtime
    command: [/runtime/clearapi-acceptance, --port, '3000', --log-dir, /runtime/gateway-logs]
    environment:
      SQLITE_PATH: /ledger/gateway.db
      SESSION_SECRET: ${SUB2_ACCEPTANCE_SESSION_SECRET:?required}
      CLEARAPI_DURABLE_WALLET: 'true'
      CLEARAPI_BILLING_OUTBOX: 'true'
      CLEARAPI_POOL_ENABLED: 'false'
      CLEARAPI_POOL_CLIPROXY_DEDICATED: 'false'
      BATCH_UPDATE_ENABLED: 'false'
      STREAMING_TIMEOUT: '5'
    volumes:
      - ${SUB2_ACCEPTANCE_RUNTIME:?required}:/runtime
      - acceptance-gateway-data:/ledger
    ports:
      - '127.0.0.1:18883:3000'
    networks: [pool]
volumes:
  acceptance-gateway-data:
