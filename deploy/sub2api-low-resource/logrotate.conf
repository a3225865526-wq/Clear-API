# Install with the host logrotate scheduler after verifying ROOT and retention.
# Business audit/consume records remain in PostgreSQL and encrypted backups.
/opt/clearapi/stack/data/gateway/logs/*.log /opt/clearapi/stack/data/logs/*.log /opt/clearapi/stack/recovery/*/data/gateway/logs/*.log /opt/clearapi/stack/recovery/*/data/logs/*.log {
    daily
    maxsize 10M
    rotate 7
    maxage 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
