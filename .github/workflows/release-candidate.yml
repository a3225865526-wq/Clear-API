name: Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/a3225865526-wq/clearapi

jobs:
  qualification:
    uses: ./.github/workflows/release-validation.yml

  frontend-release:
    name: Frontend production build
    runs-on: ubuntu-latest
    # Matches the CI frontend budget: the 10-minute CI cap was hit and
    # cancelled vitest mid-run, so the candidate build gets the same headroom.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Full frontend typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Production build
        env:
          VITE_REACT_APP_VERSION: candidate-${{ github.sha }}
        run: DISABLE_ESLINT_PLUGIN='true' bun run build

  docker:
    name: Docker build, GHCR push, exact digest
    needs: [qualification, frontend-release]
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.digest.outputs.image_digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Login to GHCR (password-stdin)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image from exact commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPO: https://github.com/${{ github.repository }}
          BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          BUILD_TS="${BUILD_TIMESTAMP:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          docker build \
            --build-arg SOURCE_COMMIT="${SOURCE_COMMIT}" \
            --build-arg SOURCE_REPO="${SOURCE_REPO}" \
            --build-arg BUILD_TIMESTAMP="${BUILD_TS}" \
            --build-arg VERSION_LABEL="candidate-${GITHUB_SHA::7}" \
            -t "$GHCR_IMAGE:sha-${GITHUB_SHA}" \
            -t "$GHCR_IMAGE:candidate-${GITHUB_SHA::7}" \
            .

      - name: Push sha tag
        run: docker push "$GHCR_IMAGE:sha-${GITHUB_SHA}" 2>&1 | tee /tmp/push-sha.log

      - name: Push candidate tag
        run: docker push "$GHCR_IMAGE:candidate-${GITHUB_SHA::7}" 2>&1 | tee /tmp/push-candidate.log

      - name: Extract exact digest
        id: digest
        run: |
          DIGEST="$(grep -oE 'digest: sha256:[a-f0-9]{64}' /tmp/push-sha.log | head -1 | cut -d' ' -f2)"
          if [ -z "$DIGEST" ]; then
            echo "push output did not contain a digest"
            exit 1
          fi
          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "image digest: $DIGEST"

      - name: Verify digest pull and provenance labels
        run: |
          docker pull "$GHCR_IMAGE@$IMAGE_DIGEST"
          REVISION="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$GHCR_IMAGE@$IMAGE_DIGEST")"
          if [ "$REVISION" != "${GITHUB_SHA}" ]; then
            echo "image revision label '$REVISION' does not match source commit '${GITHUB_SHA}'"
            exit 1
          fi
          DOCKERFILE_HASH="$(sha256sum Dockerfile | cut -d' ' -f1)"
          {
            echo "## Release candidate provenance"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| source commit | ${GITHUB_SHA} |"
            echo "| workflow run | ${GITHUB_RUN_ID} |"
            echo "| image | ${GHCR_IMAGE} |"
            echo "| digest | ${IMAGE_DIGEST} |"
            echo "| Dockerfile sha256 | ${DOCKERFILE_HASH} |"
            echo "| created | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io
