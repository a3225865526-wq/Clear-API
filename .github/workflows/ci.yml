name: CI

on:
  pull_request:
  push:
    branches:
      - 'codex/production-cicd'
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend vet, build, test, migration binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      # go vet is intentionally absent: the frozen 603b217 baseline is not
      # vet-clean (pre-existing struct-tag / unkeyed-field findings in
      # business code), and the acceptance spec requires tests + build
      # validation, not vet. Fixing the findings would violate the
      # zero-business-change constraint.
      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build bootstrap and migration binaries
        run: |
          go build -o /tmp/ci-bin/production-bootstrap ./cmd/production-bootstrap
          go build -o /tmp/ci-bin/finance-migrate ./cmd/finance-migrate
          go build -o /tmp/ci-bin/billing-migrate ./cmd/billing-migrate
          /tmp/ci-bin/billing-migrate 2>&1 | grep -q "No migration executed" || {
            echo "billing-migrate binary does not honor the no-approval fail-closed contract"
            exit 1
          }

      - name: Test root and relaykit modules (baseline-aware)
        # -p=2: the 2-vCPU runner starves SQLite-backed concurrency tests
        # when every package runs in parallel (SQLITE_BUSY flakes).
        env:
          GOFLAGS: -p=2
        run: bash scripts/ci/go-test-baseline.sh make test

      - name: Verify one-use legacy maintenance and V2 failure contracts
        run: sudo python3 scripts/ci/test-legacy-transition.py

  frontend:
    name: Frontend typecheck and test
    runs-on: ubuntu-latest
    # b581f111: the 10-minute cap was hit (10m19s wall clock), which
    # cancelled the vitest step mid-run rather than reporting a test
    # failure. Dependency install + vitest + rsbuild production build
    # needs headroom on a cold 2-vendor runner.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tsgo typecheck is intentionally absent: the frozen 603b217 baseline
      # has a pre-existing TS6133 finding in a business test file; the
      # production build path (rsbuild) does not run it either.
      - name: Test
        run: bun run test

      - name: Production build
        env:
          VITE_REACT_APP_VERSION: ci-${{ github.sha }}
        run: DISABLE_ESLINT_PLUGIN='true' bun run build

  secret-scan:
    name: Secret scan and forbidden files
    runs-on: ubuntu-latest
    # Run 38890189683 exhausted 5 minutes in the unchanged full wrapper suite.
    # Keep every check and assertion; allow the real regression suite to finish.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Scan tracked files for secrets and forbidden artifacts
        run: bash scripts/ci/secret-scan.sh

      - name: Validate deployment wrapper modes
        run: |
          bash -n scripts/clearapi-install-approved-script.sh
          shellcheck --severity=warning scripts/clearapi-install-approved-script.sh
          (cd scripts && sha256sum --check runtime-identity-artifacts.sha256)
          bash -n scripts/production-deploy.sh
          shellcheck --severity=warning scripts/production-deploy.sh
          python3 scripts/ci/test-production-deploy.py
          bash -n scripts/production-deploy-v2.sh
          # V2 bytes are pinned by the release control and contract test.
          # Its parsed digest tuple includes an unused field, and export "$name"
          # intentionally exports the validated variable named by $name.
          shellcheck --severity=warning --exclude=SC2034,SC2163 scripts/production-deploy-v2.sh
          DEPLOY_SOURCE=scripts/production-deploy-v2.sh python3 scripts/ci/test-production-deploy.py WrapperModesTest WorkflowStdinTest
          sudo python3 scripts/ci/test-pg03-release.py
          sudo visudo --check --file scripts/pg03-deploy.sudoers
          sudo python3 scripts/ci/test-production-deploy.py RuntimeIdentityTest
          bash -n scripts/production-backup.sh
          shellcheck --severity=warning scripts/production-backup.sh
          python3 scripts/ci/test-backup-identity.py
